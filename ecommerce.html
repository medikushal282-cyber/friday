<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Simple E‑Commerce Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #F5F2EA;
            --black: #0A0A0A;
            --yellow: #FFE600;
            --green: #22C55E;
            --card: #FFFFFF;
            --accent: #ff6b6b;
        }
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;}
        body{background:var(--bg);color:var(--black);min-height:100vh;padding:2rem;display:flex;flex-direction:column;align-items:center;}
        .container{max-width:960px;width:100%;background:var(--card);border:3px solid var(--black);box-shadow:6px 6px 0 var(--black);border-radius:4px;padding:2rem;}
        h1{font-size:2.2rem;font-weight:900;margin-bottom:.75rem;}
        .products{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1.5rem;margin-top:1.5rem;}
        .product{border:2px solid var(--black);padding:1rem;background:#fafafa;display:flex;flex-direction:column;justify-content:space-between;}
        .product img{width:100%;height:150px;object-fit:cover;margin-bottom:.75rem;background:#ddd;}
        .product h3{font-size:1.1rem;margin-bottom:.5rem;}
        .product p{margin-bottom:.5rem;}
        .btn{border:2px solid var(--black);padding:8px 12px;font-weight:800;font-size:13px;cursor:pointer;transition:all .15s ease;box-shadow:3px 3px 0 var(--black);text-align:center;}
        .btn-primary{background:var(--yellow);color:var(--black);}
        .btn-primary:hover{background:var(--black);color:var(--yellow);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--black);}
        .cart{margin-top:2rem;border-top:2px solid var(--black);padding-top:1rem;}
        .cart h2{font-size:1.5rem;margin-bottom:.5rem;}
        .cart-items{max-height:200px;overflow-y:auto;margin-bottom:1rem;}
        .cart-item{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid #e0e0e0;}
        .cart-total{font-weight:900;font-size:1.2rem;margin-bottom:1rem;}
        .empty{font-style:italic;color:#555;}
    </style>
</head>
<body>
    <div class="container">
        <h1>Simple Shop</h1>
        <p>Click “Add to Cart” to put items in your shopping cart. This is a pure‑HTML/JS demo.</p>

        <section class="products" id="productList"></section>

        <section class="cart" id="cartSection">
            <h2>Your Cart</h2>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-total" id="cartTotal"></div>
            <button class="btn btn-primary" id="checkoutBtn">Checkout</button>
        </section>
    </div>

    <script>
        const products = [
            { id:1, name:"Blue T‑Shirt", price:19.99, img:"https://via.placeholder.com/300x150?text=Blue+T-Shirt" },
            { id:2, name:"Red Hoodie", price:34.99, img:"https://via.placeholder.com/300x150?text=Red+Hoodie" },
            { id:3, name:"Green Cap", price:12.49, img:"https://via.placeholder.com/300x150?text=Green+Cap" },
            { id:4, name:"Yellow Sneakers", price:59.99, img:"https://via.placeholder.com/300x150?text=Yellow+Sneakers" }
        ];

        const cart = {};

        function renderProducts() {
            const list = document.getElementById('productList');
            list.innerHTML = "";
            products.forEach(p => {
                const div = document.createElement('div');
                div.className = "product";
                div.innerHTML = `
                    <img src="${p.img}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <p>$${p.price.toFixed(2)}</p>
                    <button class="btn btn-primary" onclick="addToCart(${p.id})">Add to Cart</button>
                `;
                list.appendChild(div);
            });
        }

        function addToCart(id) {
            if (!cart[id]) cart[id] = { ...products.find(p=>p.id===id), qty:0 };
            cart[id].qty++;
            updateCart();
        }

        function removeFromCart(id) {
            if (cart[id]) {
                cart[id].qty--;
                if (cart[id].qty <= 0) delete cart[id];
                updateCart();
            }
        }

        function updateCart() {
            const itemsDiv = document.getElementById('cartItems');
            itemsDiv.innerHTML = "";
            let total = 0;
            const ids = Object.keys(cart);
            if (ids.length===0) {
                itemsDiv.innerHTML = '<p class="empty">Your cart is empty.</p>';
            } else {
                ids.forEach(id => {
                    const item = cart[id];
                    const line = document.createElement('div');
                    line.className = "cart-item";
                    line.innerHTML = `
                        <span>${item.name} × ${item.qty}</span>
                        <span>
                            $${(item.price*item.qty).toFixed(2)}
                            <button class="btn btn-secondary" style="margin-left:8px;padding:2px 6px;font-size:11px;" onclick="removeFromCart(${item.id})">✕</button>
                        </span>
                    `;
                    itemsDiv.appendChild(line);
                    total += item.price * item.qty;
                });
            }
            document.getElementById('cartTotal').innerText = "Total: $" + total.toFixed(2);
        }

        document.getElementById('checkoutBtn').addEventListener('click', () => {
            const ids = Object.keys(cart);
            if (ids.length===0) {
                alert("Your cart is empty!");
                return;
            }
            let summary = "Order Summary:\\n\\n";
            let total = 0;
            ids.forEach(id => {
                const item = cart[id];
                summary += `${item.name} × ${item.qty} = $${(item.price*item.qty).toFixed(2)}\\n`;
                total += item.price * item.qty;
            });
            summary += `\\nTotal: $${total.toFixed(2)}\\n\\nThank you for your purchase!`;
            alert(summary);
            // reset cart
            Object.keys(cart).forEach(k=>delete cart[k]);
            updateCart();
        });

        renderProducts();
        updateCart();
    </script>
</body>
</html>
