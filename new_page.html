<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg: #fafafa;
            --text: #222;
            --primary: #0066ff;
            --secondary: #ff6600;
            --card: #fff;
            --border: #ddd;
        }
        * { box-sizing: border-box; margin:0; padding:0; font-family: Arial, Helvetica, sans-serif; }
        body { background: var(--bg); color: var(--text); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:2rem; }
        .container { background: var(--card); border: 2px solid var(--border); padding:2rem; border-radius:8px; max-width:600px; width:100%; box-shadow:0 4px 8px rgba(0,0,0,0.1); }
        h1 { margin-bottom:1rem; font-size:2rem; }
        p { margin-bottom:1rem; line-height:1.5; }
        .btn { display:inline-block; padding:0.5rem 1rem; margin-right:0.5rem; border:none; border-radius:4px; cursor:pointer; text-decoration:none; font-weight:bold; }
        .btn-primary { background: var(--primary); color:#fff; }
        .btn-secondary { background: var(--secondary); color:#fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the New Page</h1>
        <p>This is a freshly generated HTML file. Use it as a starting point for your project.</p>
        <a href="#" class="btn btn-primary">Primary Action</a>
        <a href="#" class="btn btn-secondary">Secondary Action</a>
    </div>
</body>
</html>
